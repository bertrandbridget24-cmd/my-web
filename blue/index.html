<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【Catherine】 | 跨界生活藝術家</title>

    <!-- 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">

    <!-- 海洋藍主題套件（順序不要調換：tokens 要在最前面） -->
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/effects.css">
</head>
<body>

    <!-- 背景漂浮水母：只會在 Hero 與 CTA 之間的淺色區段露出來 -->
    <div data-ocean="jellyfish" data-count="5"></div>


    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">
                    <img src="../logo-transparent.png" alt="Catherine 個人網站 Logo" class="site-logo">
                </a>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">主頁</a></li>
                <li><a href="about.html">個人介紹</a></li>
                <li><a href="cooking.html">烹飪作品</a></li>
                <li><a href="web-design.html">網頁作品</a></li>
                <li><a href="other-works.html">其他作品</a></li>
                <li><a href="services.html">其他服務</a></li>
            </ul>
            <button class="nav-toggle" type="button" aria-label="開啟選單"
                    aria-expanded="false" aria-controls="nav-links">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <section class="hero" id="home">

        <!-- 上升的氣泡：改數量就改 data-count -->
        <div data-ocean="bubbles" data-count="9"></div>

        <!-- 悠游的小魚：改數量就改 data-count -->
        <div data-ocean="fish" data-count="8"></div>

        <div class="hero-inner">
            <p class="eyebrow" data-text="home.heroEyebrow"></p>
            <h1 data-text="home.heroTitle"></h1>
            <p class="lead" data-text="home.heroLead"></p>
            <div class="cta-buttons">
                <a class="cta-primary"   data-ocean="btn-bubbles" data-text="home.heroBtn1Text" data-href="home.heroBtn1Href"></a>
                <a class="cta-secondary" data-ocean="btn-bubbles" data-text="home.heroBtn2Text" data-href="home.heroBtn2Href"></a>
            </div>
        </div>

        <a href="#intro" class="scroll-cue" aria-label="向下捲動">SCROLL</a>

        <div class="wave-divider" aria-hidden="true">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,64 C180,110 340,10 560,44 C780,78 900,120 1120,88 C1280,64 1360,34 1440,44 L1440,120 L0,120 Z"
                      fill="#EEF4F8" opacity="0.45"></path>
                <path d="M0,86 C200,120 360,42 600,66 C820,88 980,124 1200,96 C1320,80 1390,62 1440,70 L1440,120 L0,120 Z"
                      fill="#EEF4F8"></path>
            </svg>
        </div>
    </section>

    <section class="section reveal" id="intro">
        <div class="section-head">
            <p class="eyebrow" style="color:var(--primary-color);" data-text="home.introEyebrow"></p>
            <h2 data-text="home.introTitle"></h2>
            <div class="rule"></div>
        </div>
        <div class="intro-card" data-list="home.introParas"></div>
    </section>

    <section class="section reveal" id="works">
        <div class="section-head">
            <p class="eyebrow" style="color:var(--primary-color);" data-text="home.worksEyebrow"></p>
            <h2 data-text="home.worksTitle"></h2>
            <div class="rule"></div>
        </div>

        <div class="preview-grid" data-list="home.cards"></div>
    </section>

    <section class="cta-band">
        <div class="wave-top" aria-hidden="true">
            <svg viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,40 C220,86 420,4 660,32 C880,58 1040,88 1260,58 C1350,46 1400,34 1440,38 L1440,80 L0,80 Z"
                      fill="#EEF4F8"></path>
            </svg>
        </div>

        <div class="cta-band-inner">
            <h2 data-text="home.ctaTitle"></h2>
            <p data-text="home.ctaText"></p>
            <a class="btn-light" data-text="home.ctaBtnText" data-href="home.ctaBtnHref"></a>
        </div>

        <!-- 海床：海草數量改 data-weeds，不要螃蟹就把 data-crab 改成 0 -->
        <div data-ocean="seabed" data-weeds="10" data-crab="1"></div>
    </section>

    <footer class="site-footer">
        <div class="social-links">
            <a href="https://www.instagram.com/wzy.8_8_23/">IG</a>
            <a href="#">LinkedIn</a>
            <a href="https://mail.google.com/mail/u/0/?ogbl#inbox?compose=DmwnWsTJvbnGBJTShSvqJzrMzLqKKMHwXggNFFKbvbCsBgcFtXdnCcwpDwkfLscGXXWVbzbGtRtl">Email</a>
        </div>
        <p class="copyright">&copy; 2026 catherine0429. All rights reserved.</p>
    </footer>

    <!-- 內容資料 → 渲染 → 特效，順序不能調換 -->
    <script src="assets/js/site-data.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/ocean.js"></script>
    <script src="assets/js/ui.js"></script>

</body>
</html>
