    <!-- ================================================================
         「浪潮迭起」小遊戲的視窗結構（主角叫太陽魚超人）
         這些 id 是 assets/js/sunfish.js 指定的，不要改名：
         sunfish-overlay / sunfish-canvas / sunfish-score / sunfish-best /
         sunfish-start / sunfish-end / sunfish-final / sunfish-final-best
         想調難度（重力、速度、縫隙大小）改 sunfish.js 最上面的 CFG
         ================================================================ -->
    <div class="game-overlay" id="sunfish-overlay" role="dialog" aria-modal="true" aria-label="浪潮迭起小遊戲">
        <div class="game-panel">
            <div class="game-bar">
                <strong>浪潮迭起</strong>
                <div class="game-stats">
                    <span>分數 <b id="sunfish-score">0</b></span>
                    <span>最佳 <b id="sunfish-best">0</b></span>
                </div>
                <button class="game-close" type="button" aria-label="關閉遊戲" onclick="closeSunfish()">×</button>
            </div>

            <div class="game-stage">
                <canvas id="sunfish-canvas" class="game-canvas" width="420" height="520"></canvas>

                <div class="game-screen" id="sunfish-start">
                    <div class="sunfish-hero" aria-hidden="true">
                        <svg viewBox="0 0 64 64">
                            <path d="M20 32 L8 24 L8 40 Z" fill="#F0B36B"/>
                            <path d="M22 22 Q8 30 12 44 Q18 38 24 40 Z" fill="#E8909C"/>
                            <g stroke="#FFCF7A" stroke-width="3" stroke-linecap="round">
                                <path d="M36 8v6M36 50v6M14 32h0M56 32h6M21 17l4 4M51 43l4 4M55 17l-4 4M25 43l-4 4"/>
                            </g>
                            <circle cx="36" cy="32" r="15" fill="#FFD98A"/>
                            <circle cx="31" cy="27" r="5" fill="#FFF1C8" opacity=".8"/>
                            <circle cx="42" cy="28" r="2.4" fill="#0A2A3D"/>
                            <path d="M39 35 a3.4 3.4 0 0 0 6 0" fill="none" stroke="#0A2A3D" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <h3>浪潮迭起</h3>
                    <p>操控太陽魚超人：點畫面往上衝，不點就往下沉。<br>穿過雲和海草之間的縫隙，越遠越好。</p>
                    <div class="sunfish-keys">
                        <span>點畫面</span>
                        <span class="only-desktop">或 <kbd>空白鍵</kbd> <kbd>↑</kbd></span>
                    </div>
                    <button class="game-btn" type="button" onclick="startSunfish()">開始</button>
                </div>

                <div class="game-screen" id="sunfish-end" hidden>
                    <h3>撞到了</h3>
                    <div class="game-score-big" id="sunfish-final">0</div>
                    <p class="sunfish-best">最佳紀錄 <b id="sunfish-final-best">0</b></p>
                    <button class="game-btn" type="button" onclick="startSunfish()">再玩一次</button>
                </div>
            </div>

            <div class="game-hint">點畫面上升 ・ 空白鍵也可以 ・ Esc 關閉</div>
        </div>
    </div>
